<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!--
    TODO 1: Build the basic layout. You'll need at minimum:
      - A heading/title
      - A text input for the city name
      - A button (or form) to trigger the search
      - A container div where the results will be injected by JS,
        e.g. <div id="weather-result"></div>
      - A place to show error messages, e.g. <div id="error-message"></div>

    Suggested structure (fill in / adjust as you like):
  -->
  <main>
    <h1>Weather Checker</h1>

    <!-- TODO 2: form or input + button here -->
    <form onsubmit="submitCity(event)">
      <label for="cityInput">City Name:</label>
      <input type="text" id="cityInput" name="cityInput" placeholder="Enter City here" required>
      
      <!-- Submit Button -->
      <button type="submit" onclick="showValue()">Submit</button>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
